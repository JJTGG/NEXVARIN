name: NEXVARIN validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Go, PostgreSQL and Podman validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexvarin_test
          POSTGRES_USER: nexvarin_test
          POSTGRES_PASSWORD: nexvarin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexvarin_test -d nexvarin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Enforce Go formatting
        shell: bash
        run: |
          mapfile -d '' -t go_files < <(git ls-files -z -- '*.go')

          if [ "${#go_files[@]}" -eq 0 ]; then
            echo "No tracked Go files were found."
            exit 1
          fi

          unformatted="$(gofmt -l "${go_files[@]}")"

          if [ -n "$unformatted" ]; then
            printf 'These Go files need formatting:\n%s\n' "$unformatted"
            printf '\nExact formatting diff from the CI Go version:\n'
            gofmt -d "${go_files[@]}"
            exit 1
          fi

      - name: Install PostgreSQL client and Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client podman

      - name: Verify rootless Podman support
        shell: bash
        run: |
          rootless="$(podman info --format '{{.Host.Security.Rootless}}')"
          printf 'Podman rootless mode: %s\n' "$rootless"

          if [ "$rootless" != "true" ]; then
            echo "The CI runner does not provide verified rootless Podman."
            exit 1
          fi

      - name: Apply and verify control-plane migrations
        shell: bash
        env:
          TEST_DATABASE_URL: postgresql://nexvarin_test:nexvarin_test@127.0.0.1:5432/nexvarin_test?sslmode=disable
        run: |
          shopt -s nullglob
          migrations=(db/migrations/*.sql)

          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "No SQL migrations were found."
            exit 1
          fi

          for migration in "${migrations[@]}"; do
            echo "Applying ${migration}"

            psql "$TEST_DATABASE_URL" \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --single-transaction \
              --file="$migration"
          done

          psql "$TEST_DATABASE_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            required_tables text[] := ARRAY[
              'projects',
              'repositories',
              'operations',
              'operation_events',
              'outbox_events',
              'artifacts',
              'deployments',
              'audit_events'
            ];
            required_indexes text[] := ARRAY[
              'operations_idempotency_unique',
              'operations_due_queue_idx',
              'outbox_pending_delivery_idx',
              'artifacts_build_digest_unique'
            ];
            required_deployment_constraints text[] := ARRAY[
              'deployments_upstream_address_valid',
              'deployments_upstream_address_legacy_shape',
              'deployments_ready_requires_upstream_address'
            ];
            item text;
          BEGIN
            FOREACH item IN ARRAY required_tables LOOP
              IF to_regclass(format('public.%I', item)) IS NULL THEN
                RAISE EXCEPTION
                  'Required table public.% is missing', item;
              END IF;
            END LOOP;

            FOREACH item IN ARRAY required_indexes LOOP
              IF NOT EXISTS (
                SELECT 1
                FROM pg_indexes
                WHERE schemaname = 'public'
                  AND indexname = item
              ) THEN
                RAISE EXCEPTION
                  'Required index % is missing', item;
              END IF;
            END LOOP;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_constraint
              WHERE conname = 'operations_parent_same_repository_fk'
            ) THEN
              RAISE EXCEPTION
                'Repository-scoped parent constraint is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_constraint
              WHERE conname = 'operations_reconcile_requires_parent'
            ) THEN
              RAISE EXCEPTION
                'Reconciliation parent constraint is missing';
            END IF;

            FOREACH item IN ARRAY required_deployment_constraints LOOP
              IF NOT EXISTS (
                SELECT 1
                FROM pg_constraint
                WHERE conrelid = 'public.deployments'::regclass
                  AND conname = item
                  AND contype = 'c'
              ) THEN
                RAISE EXCEPTION
                  'Required deployment constraint % is missing', item;
              END IF;
            END LOOP;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_attribute
              WHERE attrelid = 'public.deployments'::regclass
                AND attname = 'upstream_address_required'
                AND attnotnull
                AND NOT attisdropped
            ) THEN
              RAISE EXCEPTION
                'Required upstream-address enforcement column is missing or nullable';
            END IF;

            IF to_regprocedure(
              'public.enforce_deployment_upstream_address_requirement()'
            ) IS NULL THEN
              RAISE EXCEPTION
                'Deployment upstream-address enforcement function is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1
              FROM pg_trigger
              WHERE tgrelid = 'public.deployments'::regclass
                AND tgname = 'deployments_upstream_address_requirement_guard'
                AND NOT tgisinternal
                AND tgenabled <> 'D'
            ) THEN
              RAISE EXCEPTION
                'Deployment upstream-address enforcement trigger is missing or disabled';
            END IF;
          END
          $$;
          SQL

          echo "PostgreSQL migrations and schema checks passed."

      - name: Test upstream-address migration compatibility
        shell: bash
        env:
          TEST_DATABASE_URL: postgresql://nexvarin_test:nexvarin_test@127.0.0.1:5432/nexvarin_test?sslmode=disable
        run: |
          psql "$TEST_DATABASE_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --file=db/tests/000005_upstream_address_compatibility.sql

          echo "Upstream-address migration compatibility tests passed."

      - name: Test deployment route database invariants
        shell: bash
        env:
          TEST_DATABASE_URL: postgresql://nexvarin_test:nexvarin_test@127.0.0.1:5432/nexvarin_test?sslmode=disable
        run: |
          psql "$TEST_DATABASE_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --file=db/tests/000006_deployment_routes.sql

          echo "Deployment route database behavioral tests passed."

      - name: Resolve Go dependencies
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.1

      - name: Download and verify pinned Caddy
        shell: bash
        run: |
          set -euo pipefail

          version="2.11.9"
          asset="caddy_${version}_linux_amd64.tar.gz"
          base_url="https://github.com/caddyserver/caddy/releases/download/v${version}"
          work_dir="${RUNNER_TEMP}/caddy-${version}"

          mkdir -p "$work_dir"
          cd "$work_dir"

          curl --fail --location --retry 3 --retry-all-errors \
            --silent --show-error \
            "${base_url}/caddy_${version}_checksums.txt" \
            --output checksums.txt

          curl --fail --location --retry 3 --retry-all-errors \
            --silent --show-error \
            "${base_url}/caddy_${version}_checksums.txt.pem" \
            --output checksums.txt.pem

          curl --fail --location --retry 3 --retry-all-errors \
            --silent --show-error \
            "${base_url}/caddy_${version}_checksums.txt.sig" \
            --output checksums.txt.sig

          COSIGN_EXPERIMENTAL=1 cosign verify-blob \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity "https://github.com/caddyserver/caddy/.github/workflows/release.yml@refs/tags/v${version}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            checksums.txt

          checksum_line="$(awk -v target="$asset" '
            {
              hash = $1

              if (length(hash) != 128 || hash !~ /^[[:xdigit:]]+$/) {
                next
              }

              filename = $NF
              sub(/^\*/, "", filename)
              sub(/^.*\//, "", filename)

              if (filename == target) {
                print hash "  " target
                matches++
              }
            }
            END {
              if (matches != 1) {
                exit 1
              }
            }
          ' checksums.txt)"

          if [ -z "$checksum_line" ]; then
            echo "The signed manifest has no unique SHA-512 entry for ${asset}."
            exit 1
          fi

          curl --fail --location --retry 3 --retry-all-errors \
            --silent --show-error \
            "${base_url}/${asset}" \
            --output "$asset"

          printf '%s\n' "$checksum_line" | sha512sum --check --strict -

          tar -xzf "$asset" -C "$work_dir"

          test -x "$work_dir/caddy"

          version_output="$("$work_dir/caddy" version)"
          printf 'Verified Caddy binary: %s\n' "$version_output"

          case "$version_output" in
            "v${version}"*) ;;
            *)
              echo "The downloaded Caddy binary has an unexpected version."
              exit 1
              ;;
          esac

          echo "CADDY_TEST_BINARY=$work_dir/caddy" >> "$GITHUB_ENV"

      - name: Run tests, including live rootless Podman integration
        env:
          TEST_DATABASE_URL: postgresql://nexvarin_test:nexvarin_test@127.0.0.1:5432/nexvarin_test?sslmode=disable
          NEXVARIN_PODMAN_PATH: /usr/bin/podman
          NEXVARIN_PODMAN_INTEGRATION: "1"
        run: go test -v ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Upload resolved module files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-module-metadata
          path: |
            go.mod
            go.sum
          if-no-files-found: warn
          retention-days: 7
